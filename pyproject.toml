[project]
name = "flight-price-tracker"
version = "0.1.0"
description = "CLI agent that tracks flight prices in near-realtime, stores history in Excel, and finds the cheapest time to buy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "python-dotenv>=1.0",
    "serpapi>=0.1.5",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "fast-flights>=3.0.2",
    "typing-extensions>=4.16.0",
]

[project.scripts]
flight-tracker = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
include = ["main.py"]
